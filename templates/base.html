<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-4">
    <nav class="mb-4">
      <a href="/" class="btn btn-primary">Home</a>
      <a href="/upload" class="btn btn-secondary">Admin Upload</a>
      <a href="/recommendations" class="btn btn-info">Recommendations</a>
      {% if session.get('user_id') %}
        <span class="ms-2">Hello, {{ session.get('user_name') }}</span>
        <a href="/logout" class="btn btn-danger ms-2">Logout</a>
      {% else %}
        <a href="/login" class="btn btn-success">Login</a>
        <a href="/signup" class="btn btn-warning">Sign Up</a>
      {% endif %}
    </nav>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
